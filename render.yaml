# =============================================================================
#  render.yaml — "Blueprint" de Render.com (plan gratuito)
# =============================================================================
#  Render crea el servicio solo con este archivo:
#    Dashboard → New → Blueprint → elige el repositorio RE_Wiki-Game → Apply.
#  Te pedirá dos valores (puedes cambiarlos luego en Environment):
#    ADMIN_PASSWORD  contraseña del administrador (mínimo 10 caracteres).
#    DATABASE_URL    base de datos PostgreSQL gratuita (Neon) para que los
#                    datos no se borren al reiniciar. Mira el README.
# =============================================================================
services:
  - type: web
    name: re-wiki-game            # será https://re-wiki-game.onrender.com (si está libre)
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/estado  # Render comprueba aquí que el servidor está vivo
    autoDeploy: true              # cada "git push" vuelve a publicar la web
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
