services:
  - type: web
    name: umbrella-archives
    runtime: static
    staticPublishPath: web
    buildCommand: echo "Publishing existing static Umbrella Archives website"
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
