# =============================================================================
#  Construye Umbrella Admin (.exe con Java incluido) y lo publica en Releases.
# =============================================================================
#  Se ejecuta solo cada vez que subes cambios a main (o a mano desde la
#  pestaña "Actions" → "Construir Umbrella Admin" → "Run workflow").
#  Enlace de descarga fijo de la última versión:
#    https://github.com/MarinaDP2006/RE_Wiki-Game/releases/latest/download/UmbrellaAdmin-windows.zip
# =============================================================================
name: Construir Umbrella Admin

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "servidor/**"
      - "web/**"
      - "semilla/**"
      - "construir-admin.bat"
      - ".github/workflows/construir-admin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Construir el .exe
        shell: cmd
        run: construir-admin.bat < nul

      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima dist/UmbrellaAdmin-windows.zip \
            --title "Umbrella Admin · última versión" \
            --notes "Descarga **UmbrellaAdmin-windows.zip**, descomprímelo y abre **UmbrellaAdmin.exe**. No hace falta instalar Java.

          Construido automáticamente a partir del commit ${GITHUB_SHA::7}." \
            --latest
