name: Comprobar servidor Java
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar backend sin dependencias
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build servidor/src/main/java/es/umbrella/*.java
      - name: Probar arranque y rutas públicas
        run: |
          PORT=18080 java -cp build es.umbrella.Servidor . > /tmp/umbrella.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/estado; then break; fi
            sleep 1
          done
          curl -fS http://127.0.0.1:18080/
          curl -fS http://127.0.0.1:18080/wiki/
          curl -fS http://127.0.0.1:18080/api/miembro
          python3 scripts/smoke-test.py
      - name: Mostrar errores del servidor si falla
        if: failure()
        run: cat /tmp/umbrella.log || true
