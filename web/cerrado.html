<!doctype html>
<!--
  ============================================================================
   UMBRELLA ARCHIVES · cerrado.html — Página de mantenimiento
  ============================================================================
   Se muestra cuando el administrador cierra la wiki al público.
   El servidor sustituye {{SECCION}} y {{MENSAJE}} antes de enviarla.
  ============================================================================
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{SECCION}} · Cerrado</title>
  <!-- Icono de la pestaña: el logotipo de la web -->
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Oswald:wght@400&family=Share+Tech+Mono&display=swap">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050506 radial-gradient(circle at 50% 40%, #2a0508, #050506 60%); color: #e8e2d6; font-family: Oswald, sans-serif; text-align: center; padding: 16px; }
    .caja { max-width: 620px; }
    .alerta { font: 12px "Share Tech Mono", monospace; letter-spacing: .5em; color: #ff2a3d; animation: parpadeo 1.2s steps(2) infinite; }
    @keyframes parpadeo { 50% { opacity: .2; } }
    h1 { font: 900 clamp(2rem, 7vw, 4rem)/1 Cinzel, serif; letter-spacing: .1em; margin: .3em 0; }
    p { color: #a59f94; font-size: 1.15rem; line-height: 1.6; }
    a { display: inline-block; margin-top: 18px; padding: .7em 1.4em; border: 1px solid #c8102e; color: #fff; text-decoration: none; letter-spacing: .2em; text-transform: uppercase; font-size: .85rem; }
    a:hover { background: #c8102e; }
  </style>
</head>
<body>
  <div class="caja">
    <!-- Aviso parpadeante, nombre de la sección y mensaje del administrador -->
    <div class="alerta">ZONA EN CUARENTENA</div>
    <h1>{{SECCION}}</h1>
    <p>{{MENSAJE}}</p>
    <a href="/">Volver al portal</a>
  </div>
</body>
</html>
