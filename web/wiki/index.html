<!doctype html>
<!--
  ============================================================================
   UMBRELLA ARCHIVES · Wiki de la saga Resident Evil
   wiki/index.html — Estructura de la wiki (aplicación de una sola página)
  ============================================================================
   Rutas (en el hash de la URL):
     #/                         portada
     #/s/<seccion>              listado de una sección (juegos, personajes...)
     #/f/<seccion>/<id>         ficha
     #/cronologia               línea temporal
     #/mapa                     mapa del mundo y de Raccoon City
     #/buscar/<texto>           búsqueda
   Todo el contenido llega de la base de datos por /api/wiki.
   El código está repartido en wiki/js/ (ver el orden de los <script> al final).
  ============================================================================
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Wiki de Resident Evil: juegos, películas y series, personajes, bestiario, agentes biológicos, organizaciones, ubicaciones, cronología y mapa.">
  <title>Umbrella Archives</title>
  <!-- Icono de la pestaña: el logotipo de la web -->
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <!-- Tipografías: Cinzel (títulos), Crimson Pro (texto), Oswald (interfaz), Share Tech Mono y Special Elite (detalles) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Oswald:wght@300;400;500;600&family=Share+Tech+Mono&family=Special+Elite&display=swap">
  <!-- Estilos del mapa (Leaflet), comunes de la web y propios de la wiki -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="../comun/base.css">
  <link rel="stylesheet" href="wiki.css">
</head>
<body>
  <!-- Enlace para teclado / lector de pantalla: salta directo al contenido -->
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <!-- ===================== CABECERA ===================== -->
  <header class="cabecera" id="cabecera">
    <div class="cabecera-in">
      <!-- Logotipo: vuelve a la portada -->
      <a class="marca" href="#/" aria-label="Umbrella Archives, portada">
        <span id="marca-logo"></span>
        <span class="marca-texto"><b>UMBRELLA</b><i>ARCHIVES</i></span>
      </a>
      <!-- Menú de secciones (lo rellena cabecera.js) -->
      <nav class="menu" id="menu" aria-label="Secciones"></nav>
      <!-- Buscador con sugerencias -->
      <form class="buscador" id="buscador" role="search" autocomplete="off">
        <label class="oculto-visual" for="buscar">Buscar en la wiki</label>
        <input id="buscar" type="search" placeholder="Buscar… ( / )" maxlength="60">
        <div class="sugerencias" id="sugerencias" role="listbox" hidden></div>
      </form>
      <!-- Acceso de miembros («Únete» / «Salir») -->
      <button class="btn-unirse" id="btn-unirse" type="button"><span>Únete</span></button>
      <!-- Sonido ambiente y menú móvil (iconos SVG puestos por cabecera.js) -->
      <button class="btn-icono" id="btn-ambiente" type="button" title="Sonido ambiente" aria-pressed="false"></button>
      <button class="btn-icono hamburguesa" id="btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false"></button>
    </div>
    <!-- Barra de progreso de lectura -->
    <div class="cabecera-barra" id="barra-progreso"></div>
  </header>

  <!-- ===================== CONTENIDO ===================== -->
  <!-- Cada vista (portada, sección, ficha…) se pinta aquí dentro -->
  <main id="contenido" tabindex="-1">
    <div class="cargando" id="cargando">
      <div class="cargando-anillo"></div>
      <p class="mono">ACCEDIENDO A LOS ARCHIVOS DE UMBRELLA…</p>
    </div>
  </main>

  <!-- ===================== PIE ===================== -->
  <footer class="pie">
    <div class="contenedor pie-in">
      <p><b>UMBRELLA ARCHIVES</b> · 2026</p>
    </div>
  </footer>

  <!-- Visor de tráileres a pantalla completa -->
  <div class="visor" id="visor" hidden role="dialog" aria-modal="true" aria-label="Vídeo">
    <button class="visor-cerrar" type="button" aria-label="Cerrar vídeo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></button>
    <div class="visor-marco" id="visor-marco"></div>
  </div>

  <!-- Ventana «Únete para ver lo oculto» con el botón de Google -->
  <div class="unirse" id="unirse" hidden role="dialog" aria-modal="true" aria-labelledby="unirse-titulo">
    <div class="unirse-caja">
      <button class="unirse-cerrar" type="button" aria-label="Cerrar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></button>
      <div class="unirse-logo" id="unirse-logo"></div>
      <h2 id="unirse-titulo">Únete para ver lo oculto</h2>
      <div class="google-boton" id="google-boton"></div>
      <p class="unirse-aviso" id="unirse-aviso" role="status"></p>
    </div>
  </div>

  <!-- Librería del mapa (se carga sin bloquear la página) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <!-- Efectos de ambiente y utilidades comunes (objeto Umbra) -->
  <script src="../comun/efectos.js"></script>
  <!-- Código de la wiki, en este orden: núcleo → piezas → vistas → miembros → cabecera → arranque -->
  <script src="js/nucleo.js"></script>
  <script src="js/piezas.js"></script>
  <script src="js/vistas/portada.js"></script>
  <script src="js/vistas/seccion.js"></script>
  <script src="js/vistas/ficha.js"></script>
  <script src="js/vistas/cronologia.js"></script>
  <script src="js/vistas/mapa.js"></script>
  <script src="js/vistas/buscar.js"></script>
  <script src="js/miembros.js"></script>
  <script src="js/cabecera.js"></script>
  <script src="js/arranque.js"></script>
</body>
</html>
